<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Neuro-Inclusiva TESI - Galería Interactiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Enlace al nuevo archivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Red Neuro-Inclusiva</h1>
        <p>Explora interactuando con las tarjetas</p>
    </header>

    <div class="ia-container">
        
        <!-- Tarjeta 1: TDAH -->
        <figure>
            <div class="bg-gradient bg-tdah"></div>
            <input type="radio" name="radio-set" checked="checked" /> 
            <figcaption><span>TDAH</span></figcaption> 
            
            <div class="inner-content">
                <h2>TDAH</h2>
                
                <div class="hotspot hs-1" tabindex="0">+
                    <div class="popup-info">
                        <h3>Hiperenfoque</h3>
                        <p>Dificultad en rutinas, pero capacidad de atención extrema en temas de alto interés.</p>
                    </div>
                </div>

                <div class="hotspot hs-2" tabindex="0">+
                    <div class="popup-info">
                        <h3>¿Cómo aprenden?</h3>
                        <p>A través del movimiento (Kinestésico) y mediante retos cortos o gamificación.</p>
                    </div>
                </div>
            </div>

            <!-- Tarjeta 2: TEA -->
            <figure>
                <div class="bg-gradient bg-tea"></div>
                <input type="radio" name="radio-set" /> 
                <figcaption><span>TEA (Autismo)</span></figcaption> 
                
                <div class="inner-content">
                    <h2>Espectro Autista</h2>
                    
                    <div class="hotspot hs-1" tabindex="0">+
                        <div class="popup-info">
                            <h3>Sobrecarga Sensorial</h3>
                            <p>Sensibilidad extrema a ruidos fuertes o luces brillantes en el aula.</p>
                        </div>
                    </div>

                    <div class="hotspot hs-3" tabindex="0">+
                        <div class="popup-info">
                            <h3>Apoyo útil</h3>
                            <p>Estructura clara de la clase, instrucciones literales y evitar cambios sorpresivos.</p>
                        </div>
                    </div>
                </div>
                
                <!-- Tarjeta 3: Dislexia -->
                <figure>
                    <div class="bg-gradient bg-dislexia"></div>
                    <input type="radio" name="radio-set" /> 
                    <figcaption><span>Dislexia</span></figcaption> 
                    
                    <div class="inner-content">
                        <h2>Dislexia</h2>
                        
                        <div class="hotspot hs-1" style="top: 50%; left: 40%;" tabindex="0">+
                            <div class="popup-info">
                                <h3>Barrera principal</h3>
                                <p>El cerebro procesa distinto las letras; leer en voz alta bajo presión causa estrés extremo.</p>
                            </div>
                        </div>

                        <div class="hotspot hs-2" style="top: 20%; left: 60%;" tabindex="0">+
                            <div class="popup-info">
                                <h3>Fortalezas</h3>
                                <p>Altamente visuales, innovadores y con gran razonamiento espacial e intuitivo.</p>
                            </div>
                        </div>
                    </div>
                </figure>
            </figure>
        </figure>
    </div>

</body>
</html>
